spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: steam-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/steam_tracker?serverTimezone=Asia/Seoul
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
