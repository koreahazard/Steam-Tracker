- name: jar 파일 EC2로 전송
  uses: appleboy/scp-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ubuntu
    key: ${{ secrets.EC2_KEY }}
    source: "build/libs/*SNAPSHOT.jar"
    target: "/home/ubuntu/"
    strip_components: 2

- name: EC2 서버 재시작
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ubuntu
    key: ${{ secrets.EC2_KEY }}
    script: |
      sudo systemctl restart steam-tracker